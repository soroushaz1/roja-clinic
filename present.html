<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>رُژا کلینیک | نمایشگر بیمار</title>
<link rel="icon" href="favicon.svg">
<link rel="preload" href="fonts/Estedad-var.woff2" as="font" type="font/woff2" crossorigin>
<!-- The patient's screen: the live result from the doctor's window (app.js, presenter.js),
     full screen and nothing else on it. Always dark, so the face is the brightest thing. -->
<style>
@font-face{font-family:Estedad;src:url(fonts/Estedad-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#F6ECF1;font-family:Estedad,Tahoma,sans-serif;overflow:hidden}
body.quiet{cursor:none}
#view{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#000}
#view[hidden]{display:none}
.seam{position:absolute;inset:0;pointer-events:none}
.seam[hidden],.badge[hidden],.caption[hidden],.idle[hidden],.hint[hidden]{display:none}
.seam-line{position:absolute;width:3px;margin-left:-1.5px;background:#D1AC3A;box-shadow:0 0 12px #0008}
.seam-tag{position:absolute;bottom:0;transform:translateY(-28px);padding:8px 18px;border-radius:999px;
  background:#140C11CC;color:#F4E3B0;font-size:clamp(16px,1.7vw,26px);font-weight:600}
.badge{position:absolute;top:22px;right:22px;padding:8px 16px;border-radius:999px;background:#140C11D9;
  border:1px solid #3C2A35;font-size:clamp(13px,1.1vw,18px);color:#D9C6CF}
/* At the top, over the hair, not over the chin and jaw that some procedures change. */
.caption{position:absolute;left:50%;top:22px;transform:translateX(-50%);max-width:60vw;
  padding:10px 24px;border-radius:18px;background:#140C11D9;font-size:clamp(18px,2vw,32px);font-weight:700;text-align:center;line-height:1.6}
html:not(:fullscreen) .caption{top:84px}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#2A1720 0%,#000 70%)}
.idle .mark{width:clamp(90px,12vw,160px);aspect-ratio:1;border-radius:50%;border:3px solid #EC5A84;box-shadow:0 0 40px #EC5A8455}
.idle h1{margin:10px 0 0;font-size:clamp(28px,3.4vw,54px);font-weight:800}
.idle p{margin:0;color:#BBA1AD;font-size:clamp(16px,1.6vw,24px)}
.hint{position:absolute;left:50%;top:22px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;
  background:#EC5A84;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<video id="view" muted autoplay playsinline hidden></video>
<div class="seam" id="seam" hidden>
  <div class="seam-line" id="seam-line"></div>
  <span class="seam-tag" id="seam-before"></span>
  <span class="seam-tag" id="seam-after"></span>
</div>
<span class="badge" id="badge" hidden>شبیه‌سازی تصویری، نه نتیجهٔ قطعی</span>
<div class="caption" id="caption" hidden></div>
<div class="idle" id="idle">
  <div class="mark" aria-hidden="true"></div>
  <h1 id="idle-title">رُژا کلینیک</h1>
  <p id="idle-text">نمایشگر بیمار آماده است.</p>
</div>
<button class="hint" id="hint" type="button">برای تمام‌صفحه، اینجا را بزن (یا F)</button>
<script type="module" src="present-page.js?v=4"></script>
</body>
</html>
