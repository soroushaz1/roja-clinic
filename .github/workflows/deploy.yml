# Puts main on the server after every push to it, with tools/deploy.sh: the app in
# /var/www/clinic, served at https://pythonpath.ir/clinic/ by Roja's nginx site. Can
# also be run by hand from the Actions tab ("Run workflow").
#
# Needs the same two repository secrets as soroushaz1/roja's deploy (Settings →
# Secrets and variables → Actions):
#   ROJA_DEPLOY_KEY   the private SSH key whose public half is in the server's
#                     /root/.ssh/authorized_keys
#   ROJA_KNOWN_HOSTS  the server's host key, the output of: ssh-keyscan 204.48.27.227
# and, only if the server moves, a repository variable ROJA_HOST (default
# root@204.48.27.227).
#
# The host key is pinned rather than accepted on first sight, so the deploy key is
# never offered to a server that only claims to be this one.
name: Deploy the clinic

on:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - '**.md'
      - 'start-clinic.cmd'
  workflow_dispatch:

# One deploy at a time, in order: a newer push waits for the one before to finish
# instead of cutting it off half-way through swapping folders on the server.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to pythonpath.ir/clinic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: clinic
      url: https://pythonpath.ir/clinic/
    env:
      HAS_KEY: ${{ secrets.ROJA_DEPLOY_KEY != '' && secrets.ROJA_KNOWN_HOSTS != '' }}
    steps:
      - name: The secrets are set
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Set the ROJA_DEPLOY_KEY and ROJA_KNOWN_HOSTS repository secrets (see the top of .github/workflows/deploy.yml)."
          exit 1

      - uses: actions/checkout@v7

      # deploy.sh runs the geometry check with Node before sending anything.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: SSH key and the server's host key
        env:
          ROJA_DEPLOY_KEY: ${{ secrets.ROJA_DEPLOY_KEY }}
          ROJA_KNOWN_HOSTS: ${{ secrets.ROJA_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Keys pasted from Windows can carry \r line ends, which ssh refuses.
          printf '%s\n' "$ROJA_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/roja_deploy
          printf '%s\n' "$ROJA_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/roja_deploy ~/.ssh/known_hosts

      - name: Deploy
        env:
          ROJA_HOST: ${{ vars.ROJA_HOST || 'root@204.48.27.227' }}
        run: bash tools/deploy.sh

      # The page the server now gives out is this commit's release, and the files the
      # face tracker needs come with the types a browser insists on.
      - name: Check the live app
        run: |
          base=https://pythonpath.ir/clinic/
          want=$(grep -o 'data-release="[0-9]*"' index.html)
          ok=
          for i in 1 2 3 4 5; do
            got=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$base" | grep -o 'data-release="[0-9]*"' || true)
            [ "$got" = "$want" ] && { echo "live: $got"; ok=1; break; }
            echo "live: ${got:-nothing} (want $want), trying again"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$base does not serve $want. Is Roja's nginx site (with /clinic/) deployed?"; exit 1; }
          type(){ curl -fsSI --max-time 20 "$base$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}'; }
          # Each file and the types browsers accept for it (a regex): scripts may come as
          # either JavaScript type, modules included.
          for f in "vendor/wasm/vision_wasm_internal.wasm application/wasm" "vendor/vision_bundle.mjs (text|application)/javascript" \
                   "app.js (text|application)/javascript" "present.html text/html" "vendor/face_landmarker.task application/octet-stream"; do
            set -- $f; got=$(type "$1")
            if printf '%s' "$got" | grep -Eq "^($2)"; then echo "$1: $got"
            else echo "::error::$1 is served as '${got:-nothing}', not $2"; exit 1; fi
          done

      # What the browser is told about keeping the page, and whether Cloudflare handed
      # out a copy of its own (cf-cache-status HIT, with its age): a page kept there
      # would keep phones on an old release while this check, from elsewhere, sees the
      # new one.
      - name: How the page is cached
        if: always()
        run: |
          base=https://pythonpath.ir/clinic/
          for u in "$base" "${base}index.html" "${base}?r=$RANDOM$RANDOM" "${base}app.js"; do
            echo "== $u"
            curl -sS -D - -o page.out --max-time 20 "$u" | tr -d '\r' \
              | grep -iE '^(HTTP/|cache-control|cf-cache-status|age|cdn-cache-control|cloudflare-cdn-cache-control|expires|last-modified|etag|cf-ray|server):' || true
            grep -o 'data-release="[0-9]*"' page.out || true
          done

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/roja_deploy
