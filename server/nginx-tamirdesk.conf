# tamirdesk.ir: Roja Clinic on a domain of its own, from /var/www/clinic (the folder
# tools/deploy.sh fills; Roja's site still shows the same release at pythonpath.ir/clinic/).
# Installed by tools/deploy.sh as /etc/nginx/sites-enabled/tamirdesk. The certificate is
# Let's Encrypt's, issued and renewed through the web root /var/www/letsencrypt, which
# no deploy replaces:
#   certbot certonly --webroot -w /var/www/letsencrypt -d tamirdesk.ir -d www.tamirdesk.ir
#
# No http2 here: on nginx 1.24 it is set per address and would change the other sites
# on this port too.

# The page and the modules are checked with the server on every load (a cheap 304 when
# unchanged), so a release is picked up at once; the face model, its runtime, the font
# and the icons change rarely.
map $uri $clinic_cache {
    ~^/(vendor|fonts|icons)/  "public, max-age=604800";
    default                   "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name tamirdesk.ir www.tamirdesk.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://tamirdesk.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tamirdesk.ir;
    ssl_certificate /etc/letsencrypt/live/tamirdesk.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamirdesk.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://tamirdesk.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tamirdesk.ir;
    ssl_certificate /etc/letsencrypt/live/tamirdesk.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamirdesk.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/clinic;
    index index.html;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css image/svg+xml application/json;

    # Set here once; no location below adds headers of its own, so all of them apply.
    # The camera is the whole app, and it is allowed on this site only.
    add_header Cache-Control $clinic_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location / { try_files $uri $uri/ =404; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    # The face tracker's runtime: browsers refuse a module or WebAssembly that comes
    # with the wrong type.
    location ~ \.mjs$ { types { text/javascript mjs; } }
    location ~ \.wasm$ { types { application/wasm wasm; } }
    location ~ \.task$ { types { application/octet-stream task; } }
    location ~ /\. { deny all; }
}
